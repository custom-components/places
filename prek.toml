[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = ".*\\.md$"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = ".*\\.md$"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-added-large-files"
exclude = "^uv\\.lock$"

[[repos]]
repo = "https://github.com/kjanat/actionlint"
rev = "v1.17"

[[repos.hooks]]
id = "actionlint-shellcheck"

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.33.1"

[[repos.hooks]]
id = "zizmor"
# Pinning to a SHA needs a GitHub token and counts as an "unsafe" fix. Without a
# token, as in the CI autofix review, zizmor runs offline and only reports.
# Use a shell to read the token with `$(...)`.
shell = "sh"
entry = '''
if token="$(gh auth token 2>/dev/null)" && [ -n "$token" ]; then
  export GH_TOKEN="$token"
  set -- --fix=all "$@"
fi
exec zizmor "$@"
'''

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"

[[repos.hooks]]
id = "codespell"

[[repos]]
repo = "https://github.com/streetsidesoftware/cspell-cli"
rev = "v10.4.1"

[[repos.hooks]]
id = "cspell"
files = "(?:\\.md$|custom_components/places/translations/(?:cs|en|it|ru|sk|uk)\\.json$)"
additional_dependencies = [
  "@cspell/dict-cs-cz@3.0.8",
  "@cspell/dict-it-it@3.1.6",
  "@cspell/dict-ru_ru@2.3.2",
  "@cspell/dict-sk-sk@1.1.7",
  "@cspell/dict-uk-ua@4.0.6",
]

[[repos]]
repo = "local"

# Keep the uv hooks unlocked so a local `prek run -a` can create `.venv`
# and refresh a missing or stale lockfile. An exact sync prevents leftover
# packages from affecting the checks. CI sets `UV_LOCKED=1` externally.
[[repos.hooks]]
id = "mypy"
name = "mypy"
language = "system"
entry = "uv run --exact --group dev mypy --config-file=pyproject.toml"
types = ["python"]
require_serial = true

[[repos.hooks]]
id = "pydoclint"
name = "pydoclint"
language = "system"
entry = "uv run --exact --group dev pydoclint"
types = ["python"]
require_serial = true

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.5"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix"]

[[repos.hooks]]
id = "ruff-format"
