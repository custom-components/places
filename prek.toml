[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = ".*\\.md$"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = ".*\\.md$"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-added-large-files"
exclude = "^uv\\.lock$"

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"

[[repos.hooks]]
id = "actionlint"
additional_dependencies = ["github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1"]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"

[[repos.hooks]]
id = "codespell"

[[repos]]
repo = "https://github.com/streetsidesoftware/cspell-cli"
rev = "v10.0.1"

[[repos.hooks]]
id = "cspell"
files = "(?:\\.md$|custom_components/places/translations/(?:cs|en|it|ru|sk|uk)\\.json$)"
additional_dependencies = [
  "@cspell/dict-cs-cz@3.0.8",
  "@cspell/dict-it-it@3.1.6",
  "@cspell/dict-ru_ru@2.3.2",
  "@cspell/dict-sk-sk@1.1.7",
  "@cspell/dict-uk-ua@4.0.6",
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "mypy"
name = "mypy"
language = "system"
entry = "uv run --group dev mypy --config-file=pyproject.toml"
types = ["python"]
require_serial = true

[[repos]]
repo = "https://github.com/jsh9/pydoclint"
rev = "0.9.1"

[[repos.hooks]]
id = "pydoclint"
language_version = "python3.14"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.2"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix"]

[[repos.hooks]]
id = "ruff-format"
