name: pytest post coverage

on:
  workflow_run:
    workflows: ['pytest check and post coverage']
    types:
      - completed

jobs:
  test:
    name: pytest post coverage
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      # Posts or updates the artifact-generated coverage comment when the PR
      # workflow could not comment directly, such as for a fork PR.
      pull-requests: write
      # Allows the coverage action to inspect repository metadata while posting.
      contents: read
      # Reads the triggering workflow run and downloads its comment artifact.
      actions: read
    steps:
      # DO NOT run actions/checkout here, for security reasons
      # For details, refer to https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
      - name: Post coverage Comment to PR
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVITY: post_comment
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
          # Update those if you changed the default values:
          # COMMENT_ARTIFACT_NAME: python-coverage-comment-action
          # COMMENT_FILENAME: python-coverage-comment-action.txt

  publish-default-coverage:
    name: Publish default coverage data
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout tested default-branch commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download coverage data from test run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "${RUN_ID}" --repo "${REPOSITORY}" \
            --name python-coverage-data --dir .

      - name: Publish default-branch coverage data
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVITY: save_coverage_data_files
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70
