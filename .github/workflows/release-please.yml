name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout the released tag
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          persist-credentials: false

      - name: Build and upload the HACS archive
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(jq -r .version custom_components/places/manifest.json)" = "$RELEASE_VERSION"
          grep -Fx "VERSION = \"$RELEASE_VERSION\"  # x-release-please-version" \
            custom_components/places/const.py
          git archive --format=zip --output="$RUNNER_TEMP/places.zip" \
            HEAD:custom_components/places
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/places.zip#places.zip" \
            --clobber --repo "$GITHUB_REPOSITORY"
