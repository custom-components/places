name: Release

run-name: Release ${{ inputs.tag || inputs.bump }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable version bump when tag is blank
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      tag:
        description: Release tag (for example, v3.0.1 or v3.1.0-beta.1)
        required: false
        default: ""
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore automatic release tag
        if: inputs.tag == '' && inputs.prerelease == false && github.run_attempt != 1
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: release-resolution-${{ github.run_id }}
          path: ${{ runner.temp }}/release-resolution
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Resolve release tag
        id: release_tag
        env:
          BUMP_TYPE: ${{ inputs.bump }}
          EXPLICIT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          PERSISTED_TAG_PATH: ${{ runner.temp }}/release-resolution/release-tag
          REQUIRE_PERSISTED_TAG: ${{ github.run_attempt != 1 }}
        run: python3 .github/scripts/resolve_release_tag.py

      - name: Persist automatic release tag
        if: inputs.tag == '' && inputs.prerelease == false && github.run_attempt == 1
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: release-resolution-${{ github.run_id }}
          path: ${{ runner.temp }}/release-resolution/release-tag

      - name: Validate release request
        id: validate_release_request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Release workflow must be dispatched from $DEFAULT_BRANCH, not $RELEASE_REF." >&2
            exit 1
          fi

          python3 .github/scripts/prepare_release.py --check-only "$RELEASE_TAG"

          bash .github/scripts/publish_release.sh check

          tag_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk 'NF == 2 { print $1 }')"
          if [[ -n "$tag_commit" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            python3 .github/scripts/validate_release_commit.py \
              "$GITHUB_SHA" "$tag_commit" "$RELEASE_TAG"

            git checkout --detach "$tag_commit"
            python3 .github/scripts/prepare_release.py "$RELEASE_TAG"
            if ! git diff --quiet -- custom_components/places/manifest.json custom_components/places/const.py; then
              echo "Existing release tag $RELEASE_TAG does not contain matching version files." >&2
              exit 1
            fi

            echo "resume_tag=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release tag $RELEASE_TAG is not an annotated tag with a peeled commit." >&2
            exit 1
          else
            echo "resume_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create versioned release commit
        if: ${{ steps.validate_release_request.outputs.resume_tag != 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: |
          set -euo pipefail

          python3 .github/scripts/prepare_release.py "$RELEASE_TAG"

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/places/manifest.json custom_components/places/const.py
          git commit -m "Release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"

      - name: Build HACS archive from release commit
        run: |
          set -euo pipefail
          git archive \
            --format=zip \
            --output="$RUNNER_TEMP/places.zip" \
            HEAD:custom_components/places
          unzip -t "$RUNNER_TEMP/places.zip"

      - name: Push release tag
        if: ${{ steps.validate_release_request.outputs.resume_tag != 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: git push origin "refs/tags/$RELEASE_TAG"

      - name: Create or resume and publish release with HACS archive
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/places.zip
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: bash .github/scripts/publish_release.sh publish
