name: 'Pull Request Labeler'
on:
  pull_request_target:

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Pull Request Labeler
        uses: srvaroa/labeler@9c29ad1ef33d169f9ef33c52722faf47a566bcf3 # v1
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
