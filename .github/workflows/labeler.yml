name: 'Pull Request Labeler'
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] Label fork PRs using the base repository config without checking out PR code.

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Pull Request Labeler
        uses: srvaroa/labeler@v1
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
