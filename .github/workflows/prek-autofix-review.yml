name: prek-autofix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: prek-autofix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup uv (with caching)
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          ignore-nothing-to-cache: true
          cache-dependency-glob: uv.lock

      - id: review
        if: github.event_name == 'pull_request'
        uses: Snuffy2/prek-autofix/review@v1
        env:
          UV_LOCKED: "1"

      - name: Verify prek without pull-request context
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          UV_LOCKED=1 uv run --locked prek run --all-files
          test -z "$(git status --porcelain)"
